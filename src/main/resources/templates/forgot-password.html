<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - Blood Bank</title>


    <style>

        /* ================= RESET ================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        /* ================= BODY ================= */

        body {

            min-height: 100vh;

            background:
                    linear-gradient(
                            135deg,
                            #8b0000,
                            #d32f2f,
                            #ff6f6f
                    );

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 30px;
        }


        /* ================= CONTAINER ================= */

        .forgot-container {

            width: 100%;

            max-width: 500px;

            background:
                    rgba(255, 255, 255, 0.96);

            padding: 45px 50px;

            border-radius: 25px;

            box-shadow:
                    0 15px 40px
                    rgba(0, 0, 0, 0.25);

            text-align: center;

            animation:
                    containerAppear
                    0.6s
                    ease-in-out;
        }


        @keyframes containerAppear {

            from {

                opacity: 0;

                transform:
                        translateY(20px);
            }

            to {

                opacity: 1;

                transform:
                        translateY(0);
            }
        }


        /* ================= ICON ================= */

        .lock-icon {

            font-size: 65px;

            margin-bottom: 15px;
        }


        /* ================= HEADING ================= */

        h1 {

            color: #8b0000;

            font-size: 36px;

            margin-bottom: 10px;
        }


        .subtitle {

            color: #666;

            font-size: 16px;

            line-height: 1.5;

            margin-bottom: 30px;
        }


        /* ================= FORM ================= */

        .form-group {

            text-align: left;

            margin-bottom: 20px;
        }


        label {

            display: block;

            color: #333;

            font-weight: bold;

            margin-bottom: 8px;

            font-size: 15px;
        }


        input {

            width: 100%;

            padding: 14px 16px;

            border:
                    1px solid
                    #ddd;

            border-radius: 10px;

            font-size: 16px;

            outline: none;

            transition: 0.3s;
        }


        input:focus {

            border-color: #d32f2f;

            box-shadow:
                    0 0 0 3px
                    rgba(211, 47, 47, 0.12);
        }


        /* ================= BUTTON ================= */

        .verify-btn {

            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 30px;

            background:
                    linear-gradient(
                            90deg,
                            #b71c1c,
                            #e53935
                    );

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 5px;

            transition: 0.3s;
        }


        .verify-btn:hover {

            transform:
                    translateY(-3px);

            box-shadow:
                    0 8px 20px
                    rgba(183, 28, 28, 0.3);
        }


        /* ================= BACK LOGIN ================= */

        .back-login {

            display: inline-block;

            margin-top: 25px;

            color: #b71c1c;

            text-decoration: none;

            font-size: 15px;

            font-weight: bold;

            transition: 0.3s;
        }


        .back-login:hover {

            color: #7f0000;

            text-decoration: underline;
        }


        /* ================= HOME ================= */

        .home-link {

            display: inline-block;

            margin-top: 15px;

            color: #777;

            text-decoration: none;

            font-size: 14px;

            transition: 0.3s;
        }


        .home-link:hover {

            color: #b71c1c;

        }


        /* ================= MOBILE ================= */

        @media (max-width: 600px) {

            body {

                padding: 20px 15px;
            }


            .forgot-container {

                padding:
                        35px 25px;

                border-radius: 20px;
            }


            h1 {

                font-size: 30px;
            }


            .lock-icon {

                font-size: 55px;
            }


            .subtitle {

                font-size: 15px;
            }


            input {

                font-size: 15px;

                padding: 13px 14px;
            }


            .verify-btn {

                font-size: 16px;
            }

        }

    </style>

</head>


<body>


<!-- ===================================================== -->
<!-- ================= MAIN CONTAINER ==================== -->
<!-- ===================================================== -->

<div class="forgot-container">


    <!-- ================= ICON ================= -->

    <div class="lock-icon">

        🔐

    </div>


    <!-- ================= HEADING ================= -->

    <h1>

        Forgot Password?

    </h1>


    <p class="subtitle">

        Enter your registered email address
        to reset your password.

    </p>


    <!-- ================= FORM ================= -->

    <form
            action="/forgot-password"
            method="post">


        <!-- ================= EMAIL ================= -->

        <div class="form-group">

            <label for="email">

                📧 Registered Email

            </label>


            <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your registered email"
                    autocomplete="email"
                    required>

        </div>


        <!-- ================= VERIFY BUTTON ================= -->

        <button
                type="submit"
                class="verify-btn">

            🔍 Verify Email

        </button>


    </form>


    <!-- ================= BACK TO LOGIN ================= -->

    <a
            href="/login"
            class="back-login">

        ← Back to Login

    </a>


    <!-- ================= HOME ================= -->

    <br>

    <a
            href="/"
            class="home-link">

        🏠 Back to Home

    </a>


</div>


</body>

</html>
