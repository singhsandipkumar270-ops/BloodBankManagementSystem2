<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Blood Request - Blood Bank</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {

            min-height: 100vh;

            background:
                    linear-gradient(
                            135deg,
                            #8b0000,
                            #d32f2f,
                            #ff6f6f
                    );

            padding: 30px 15px;
        }

        .container {

            width: 100%;

            max-width: 650px;

            margin: 30px auto;

            background: white;

            padding: 40px;

            border-radius: 25px;

            box-shadow:
                    0 15px 40px
                    rgba(0, 0, 0, 0.25);
        }

        .blood-icon {

            text-align: center;

            font-size: 60px;

            margin-bottom: 10px;
        }

        h1 {

            text-align: center;

            color: #8b0000;

            font-size: 34px;

            margin-bottom: 10px;
        }

        .subtitle {

            text-align: center;

            color: #666;

            margin-bottom: 30px;

            font-size: 15px;
        }

        .form-group {

            margin-bottom: 20px;
        }

        label {

            display: block;

            margin-bottom: 8px;

            font-weight: bold;

            color: #333;
        }

        input,
        select {

            width: 100%;

            padding: 14px 15px;

            border:
                    1px solid
                    #ddd;

            border-radius: 10px;

            font-size: 15px;

            outline: none;

            transition: 0.3s;
        }

        input:focus,
        select:focus {

            border-color: #d32f2f;

            box-shadow:
                    0 0 0 3px
                    rgba(211, 47, 47, 0.12);
        }

        .submit-btn {

            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 30px;

            background:
                    linear-gradient(
                            90deg,
                            #b71c1c,
                            #e53935
                    );

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 10px;

            transition: 0.3s;
        }

        .submit-btn:hover {

            transform:
                    translateY(-2px);

            box-shadow:
                    0 8px 20px
                    rgba(183, 28, 28, 0.3);
        }

        .back-links {

            text-align: center;

            margin-top: 25px;
        }

        .back-links a {

            display: inline-block;

            margin: 5px 8px;

            color: #b71c1c;

            text-decoration: none;

            font-weight: bold;

            font-size: 14px;
        }

        .back-links a:hover {

            text-decoration: underline;
        }

        @media (max-width: 600px) {

            .container {

                padding: 30px 20px;

                border-radius: 20px;
            }

            h1 {

                font-size: 28px;
            }

            .blood-icon {

                font-size: 50px;
            }

            input,
            select {

                font-size: 14px;
            }

        }

    </style>

</head>

<body>


<div class="container">


    <!-- ================= ICON ================= -->

    <div class="blood-icon">

        🩸

    </div>


    <!-- ================= HEADING ================= -->

    <h1>

        Request Blood

    </h1>


    <p class="subtitle">

        Fill in the details to request blood

    </p>


    <!-- ================= FORM ================= -->

    <form
            action="/blood-request"
            method="post">


        <!-- ================= NAME ================= -->

        <div class="form-group">

            <label for="requesterName">

                👤 Your Name

            </label>

            <input
                    type="text"
                    id="requesterName"
                    name="requesterName"
                    placeholder="Enter your name"
                    required>

        </div>


        <!-- ================= EMAIL ================= -->

        <div class="form-group">

            <label for="email">

                📧 Email

            </label>

            <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required>

        </div>


        <!-- ================= BLOOD GROUP ================= -->

        <div class="form-group">

            <label for="bloodGroup">

                🩸 Required Blood Group

            </label>

            <select
                    id="bloodGroup"
                    name="bloodGroup"
                    required>

                <option value="">

                    Select Blood Group

                </option>

                <option value="A+">A+</option>

                <option value="A-">A-</option>

                <option value="B+">B+</option>

                <option value="B-">B-</option>

                <option value="O+">O+</option>

                <option value="O-">O-</option>

                <option value="AB+">AB+</option>

                <option value="AB-">AB-</option>

            </select>

        </div>


        <!-- ================= QUANTITY ================= -->

        <div class="form-group">

            <label for="quantity">

                🧪 Required Units

            </label>

            <input
                    type="number"
                    id="quantity"
                    name="quantity"
                    min="1"
                    max="10"
                    placeholder="Enter required units"
                    required>

        </div>


        <!-- ================= HOSPITAL ================= -->

        <div class="form-group">

            <label for="hospital">

                🏥 Hospital Name

            </label>

            <input
                    type="text"
                    id="hospital"
                    name="hospital"
                    placeholder="Enter hospital name"
                    required>

        </div>


        <!-- ================= PHONE ================= -->

        <div class="form-group">

            <label for="phone">

                📱 Phone Number

            </label>

            <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter phone number"
                    required>

        </div>


        <!-- ================= SUBMIT ================= -->

        <button
                type="submit"
                class="submit-btn">

            🩸 Submit Blood Request

        </button>


    </form>


    <!-- ================= LINKS ================= -->

    <div class="back-links">

        <a href="/">

            ← Back to Home

        </a>

        <a href="/dashboard">

            📊 Dashboard

        </a>

    </div>


</div>


</body>

</html>
