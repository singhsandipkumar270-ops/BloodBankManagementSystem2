<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Donor - Blood Bank Management System</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            background:
                    linear-gradient(
                            135deg,
                            #7f0000,
                            #c62828,
                            #ef5350
                    );

            color: #333;
        }


        /* =====================================================
           NAVBAR
        ===================================================== */

        nav {
            min-height: 70px;

            background:
                    rgba(0, 0, 0, 0.30);

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 15px 60px;

            box-shadow:
                    0 3px 15px
                    rgba(0, 0, 0, 0.20);
        }


        .logo {
            color: white;

            font-size: 25px;

            font-weight: bold;

            white-space: nowrap;
        }


        .logo span {
            color: #ffe5e5;
        }


        .nav-links {
            display: flex;

            align-items: center;

            gap: 20px;

            flex-wrap: wrap;

            justify-content: center;
        }


        nav a {
            color: white;

            text-decoration: none;

            font-size: 15px;

            font-weight: bold;

            transition: 0.3s;
        }


        nav a:hover {
            color: #ffdada;

            transform: translateY(-2px);
        }


        .admin-badge {
            background: white;

            color: #8b0000;

            padding: 8px 14px;

            border-radius: 20px;

            font-size: 13px;

            font-weight: bold;
        }


        /* =====================================================
           MAIN
        ===================================================== */

        .main {
            width: 100%;

            max-width: 850px;

            margin: auto;

            padding: 45px 20px;
        }


        /* =====================================================
           FORM CARD
        ===================================================== */

        .form-card {
            background: white;

            border-radius: 25px;

            padding: 40px;

            box-shadow:
                    0 15px 40px
                    rgba(0, 0, 0, 0.25);
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .header {
            text-align: center;

            margin-bottom: 35px;
        }


        .blood-icon {
            font-size: 58px;

            margin-bottom: 10px;
        }


        .header h1 {
            color: #8b0000;

            font-size: 38px;

            margin-bottom: 10px;
        }


        .subtitle {
            color: #777;

            font-size: 16px;
        }


        .admin-message {
            margin-top: 15px;

            display: inline-block;

            background: #fff3cd;

            color: #856404;

            padding: 8px 18px;

            border-radius: 20px;

            font-size: 13px;

            font-weight: bold;
        }


        /* =====================================================
           FORM
        ===================================================== */

        .form-group {
            margin-bottom: 22px;
        }


        .form-row {
            display: grid;

            grid-template-columns:
                    repeat(2, 1fr);

            gap: 20px;
        }


        label {
            display: block;

            margin-bottom: 8px;

            color: #555;

            font-size: 15px;

            font-weight: bold;
        }


        input,
        select,
        textarea {

            width: 100%;

            padding: 14px 15px;

            border:
                    1px solid
                    #d5d5d5;

            border-radius: 10px;

            outline: none;

            font-size: 15px;

            background: white;

            transition: 0.3s;
        }


        input:focus,
        select:focus,
        textarea:focus {

            border-color: #c62828;

            box-shadow:
                    0 0 0 3px
                    rgba(198, 40, 40, 0.12);
        }


        textarea {

            min-height: 110px;

            resize: vertical;
        }


        /* =====================================================
           DONOR ID
        ===================================================== */

        .donor-id {

            background: #fff5f5;

            border:
                    1px solid
                    #ffcdd2;

            border-radius: 10px;

            padding: 12px 15px;

            margin-bottom: 25px;

            color: #777;

            font-size: 14px;
        }


        .donor-id strong {

            color: #8b0000;
        }


        /* =====================================================
           BUTTONS
        ===================================================== */

        .button-row {

            display: flex;

            gap: 15px;

            margin-top: 10px;
        }


        .update-btn,
        .cancel-btn {

            flex: 1;

            padding: 14px 20px;

            border-radius: 30px;

            text-decoration: none;

            text-align: center;

            font-size: 16px;

            font-weight: bold;

            transition: 0.3s;

            cursor: pointer;
        }


        .update-btn {

            border: none;

            background:
                    linear-gradient(
                            90deg,
                            #a90000,
                            #e53935
                    );

            color: white;
        }


        .update-btn:hover {

            transform: translateY(-3px);

            box-shadow:
                    0 8px 20px
                    rgba(183, 28, 28, 0.30);
        }


        .cancel-btn {

            background: #ffe5e5;

            color: #8b0000;

            border:
                    1px solid
                    #ffcdd2;
        }


        .cancel-btn:hover {

            background: #ffd2d2;

            transform: translateY(-3px);
        }


        /* =====================================================
           FOOTER
        ===================================================== */

        footer {

            text-align: center;

            color: #ffecec;

            padding: 20px;

            font-size: 14px;

            line-height: 1.6;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 700px) {

            nav {

                flex-direction: column;

                gap: 15px;

                padding: 15px 20px;
            }


            .nav-links {

                gap: 12px;
            }


            nav a {

                font-size: 13px;
            }


            .main {

                padding: 30px 12px;
            }


            .form-card {

                padding: 28px 20px;

                border-radius: 20px;
            }


            .header h1 {

                font-size: 30px;
            }


            .blood-icon {

                font-size: 50px;
            }


            .form-row {

                grid-template-columns: 1fr;

                gap: 0;
            }


            .button-row {

                flex-direction: column;
            }


            .update-btn,
            .cancel-btn {

                width: 100%;
            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     NAVBAR
===================================================== -->

<nav>

    <div class="logo">

        🩸 <span>Blood Bank</span>

    </div>


    <div class="nav-links">

        <a href="/">
            🏠 Home
        </a>

        <a href="/dashboard">
            📊 Dashboard
        </a>

        <a href="/donor">
            🩸 Donor
        </a>

        <a href="/donors">
            👥 All Donors
        </a>

        <a href="/blood-stock">
            📦 Blood Stock
        </a>

        <span class="admin-badge">

            👑 ADMIN

        </span>

    </div>

</nav>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="main">


    <div class="form-card">


        <!-- =================================================
             HEADER
        ================================================= -->

        <div class="header">

            <div class="blood-icon">

                🩸

            </div>


            <h1>

                Edit Donor

            </h1>


            <p class="subtitle">

                Update the donor information carefully

            </p>


            <div class="admin-message">

                👑 Administrator Access

            </div>

        </div>


        <!-- =================================================
             DONOR ID
        ================================================= -->

        <div class="donor-id">

            Donor ID:

            <strong th:text="${donor.id}">

                1

            </strong>

        </div>


        <!-- =================================================
             UPDATE FORM
        ================================================= -->

        <form
                action="/donor/update"
                method="post">


            <!-- HIDDEN ID -->

            <input
                    type="hidden"
                    name="id"
                    th:value="${donor.id}">


            <!-- =================================================
                 NAME
            ================================================= -->

            <div class="form-group">

                <label for="name">

                    Full Name

                </label>


                <input
                        type="text"
                        id="name"
                        name="name"
                        th:value="${donor.name}"
                        placeholder="Enter donor full name"
                        required>

            </div>


            <!-- =================================================
                 AGE + GENDER
            ================================================= -->

            <div class="form-row">


                <div class="form-group">

                    <label for="age">

                        Age

                    </label>


                    <input
                            type="number"
                            id="age"
                            name="age"
                            th:value="${donor.age}"
                            min="18"
                            max="65"
                            placeholder="Enter age"
                            required>

                </div>


                <div class="form-group">

                    <label for="gender">

                        Gender

                    </label>


                    <select
                            id="gender"
                            name="gender"
                            required>

                        <option value="">

                            Select Gender

                        </option>


                        <option
                                value="Male"
                                th:selected="${donor.gender == 'Male'}">

                            Male

                        </option>


                        <option
                                value="Female"
                                th:selected="${donor.gender == 'Female'}">

                            Female

                        </option>


                        <option
                                value="Other"
                                th:selected="${donor.gender == 'Other'}">

                            Other

                        </option>

                    </select>

                </div>

            </div>


            <!-- =================================================
                 BLOOD GROUP
            ================================================= -->

            <div class="form-group">

                <label for="bloodGroup">

                    Blood Group

                </label>


                <select
                        id="bloodGroup"
                        name="bloodGroup"
                        required>

                    <option value="">

                        Select Blood Group

                    </option>


                    <option
                            value="A+"
                            th:selected="${donor.bloodGroup == 'A+'}">

                        A+

                    </option>


                    <option
                            value="A-"
                            th:selected="${donor.bloodGroup == 'A-'}">

                        A-

                    </option>


                    <option
                            value="B+"
                            th:selected="${donor.bloodGroup == 'B+'}">

                        B+

                    </option>


                    <option
                            value="B-"
                            th:selected="${donor.bloodGroup == 'B-'}">

                        B-

                    </option>


                    <option
                            value="O+"
                            th:selected="${donor.bloodGroup == 'O+'}">

                        O+

                    </option>


                    <option
                            value="O-"
                            th:selected="${donor.bloodGroup == 'O-'}">

                        O-

                    </option>


                    <option
                            value="AB+"
                            th:selected="${donor.bloodGroup == 'AB+'}">

                        AB+

                    </option>


                    <option
                            value="AB-"
                            th:selected="${donor.bloodGroup == 'AB-'}">

                        AB-

                    </option>

                </select>

            </div>


            <!-- =================================================
                 PHONE
            ================================================= -->

            <div class="form-group">

                <label for="phone">

                    Phone Number

                </label>


                <input
                        type="tel"
                        id="phone"
                        name="phone"
                        th:value="${donor.phone}"
                        placeholder="Enter phone number"
                        required>

            </div>


            <!-- =================================================
                 ADDRESS
            ================================================= -->

            <div class="form-group">

                <label for="address">

                    Address

                </label>


                <textarea
                        id="address"
                        name="address"
                        placeholder="Enter complete address"
                        required
                        th:text="${donor.address}"></textarea>

            </div>


            <!-- =================================================
                 BUTTONS
            ================================================= -->

            <div class="button-row">


                <button
                        type="submit"
                        class="update-btn">

                    💾 Update Donor

                </button>


                <a
                        href="/donors"
                        class="cancel-btn">

                    ❌ Cancel

                </a>

            </div>


        </form>

    </div>

</main>


<!-- =====================================================
     FOOTER
===================================================== -->

<footer>

    🩸 Blood Bank Management System

    <br>

    Donate Blood • Save Lives • Help Others ❤️

</footer>


</body>

</html>
