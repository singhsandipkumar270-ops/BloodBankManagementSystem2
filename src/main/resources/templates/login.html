<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    ```
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Blood Bank</title>


    <style>

        /* ================= RESET ================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        /* ================= BODY ================= */

        body {

            min-height: 100vh;

            background:
                    linear-gradient(
                            135deg,
                            #8b0000,
                            #d32f2f,
                            #ff6f6f
                    );

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 30px;
        }


        /* ================= LOGIN CONTAINER ================= */

        .login-container {

            width: 100%;

            max-width: 500px;

            background:
                    rgba(255, 255, 255, 0.96);

            padding: 45px 50px;

            border-radius: 25px;

            box-shadow:
                    0 15px 40px
                    rgba(0, 0, 0, 0.25);

            text-align: center;

            animation:
                    containerAppear
                    0.6s
                    ease-in-out;
        }


        @keyframes containerAppear {

            from {

                opacity: 0;

                transform:
                        translateY(20px);
            }

            to {

                opacity: 1;

                transform:
                        translateY(0);
            }
        }


        /* ================= BLOOD ICON ================= */

        .blood-icon {

            font-size: 65px;

            margin-bottom: 10px;

            animation:
                    heartbeat
                    1.5s
                    infinite;
        }


        @keyframes heartbeat {

            0% {

                transform:
                        scale(1);
            }

            25% {

                transform:
                        scale(1.08);
            }

            50% {

                transform:
                        scale(1);
            }

            75% {

                transform:
                        scale(1.08);
            }

            100% {

                transform:
                        scale(1);
            }
        }


        /* ================= HEADING ================= */

        h1 {

            color: #8b0000;

            font-size: 38px;

            margin-bottom: 10px;
        }


        .subtitle {

            color: #666;

            font-size: 16px;

            margin-bottom: 25px;
        }


        /* ================= MESSAGES ================= */

        .message {

            padding: 14px 16px;

            border-radius: 10px;

            margin-bottom: 20px;

            font-size: 14px;

            font-weight: bold;

            text-align: center;
        }


        /* ================= LOGIN REQUIRED ================= */

        .login-required {

            background: #fff3cd;

            color: #856404;

            border:
                    1px solid
                    #ffe69c;
        }


        /* ================= WRONG LOGIN ================= */

        .error-message {

            background: #ffebee;

            color: #c62828;

            border:
                    1px solid
                    #ef9a9a;
        }


        /* ================= PASSWORD RESET SUCCESS ================= */

        .success-message {

            background: #e8f5e9;

            color: #2e7d32;

            border:
                    1px solid
                    #a5d6a7;
        }


        /* ================= FORM ================= */

        .form-group {

            text-align: left;

            margin-bottom: 20px;
        }


        label {

            display: block;

            color: #333;

            font-weight: bold;

            margin-bottom: 8px;

            font-size: 15px;
        }


        /* ================= INPUT ================= */

        input {

            width: 100%;

            padding: 14px 16px;

            border:
                    1px solid
                    #ddd;

            border-radius: 10px;

            font-size: 16px;

            outline: none;

            transition: 0.3s;
        }


        input:focus {

            border-color: #d32f2f;

            box-shadow:
                    0 0 0 3px
                    rgba(211, 47, 47, 0.12);
        }


        /* ================= PASSWORD BOX ================= */

        .password-box {

            position: relative;

            width: 100%;
        }


        .password-box input {

            padding-right: 50px;
        }


        /* ================= SHOW PASSWORD BUTTON ================= */

        .show-password {

            position: absolute;

            right: 12px;

            top: 50%;

            transform:
                    translateY(-50%);

            border: none;

            background: transparent;

            font-size: 20px;

            cursor: pointer;

            padding: 5px;

            color: #777;

            transition: 0.3s;
        }


        .show-password:hover {

            color: #b71c1c;

            transform:
                    translateY(-50%)
                    scale(1.1);
        }


        /* ================= FORGOT PASSWORD ================= */

        .forgot-password {

            text-align: right;

            margin-top: -10px;

            margin-bottom: 18px;
        }


        .forgot-password a {

            color: #b71c1c;

            text-decoration: none;

            font-size: 14px;

            font-weight: bold;

            transition: 0.3s;
        }


        .forgot-password a:hover {

            color: #7f0000;

            text-decoration: underline;
        }


        /* ================= LOGIN BUTTON ================= */

        .login-btn {

            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 30px;

            background:
                    linear-gradient(
                            90deg,
                            #b71c1c,
                            #e53935
                    );

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 10px;

            transition: 0.3s;
        }


        .login-btn:hover {

            transform:
                    translateY(-3px);

            box-shadow:
                    0 8px 20px
                    rgba(183, 28, 28, 0.3);
        }


        .login-btn:active {

            transform:
                    translateY(0);
        }


        /* ================= REGISTER ================= */

        .register-text {

            margin-top: 25px;

            color: #777;

            font-size: 15px;
        }


        .register-text a {

            color: #b71c1c;

            text-decoration: none;

            font-weight: bold;

            transition: 0.3s;
        }


        .register-text a:hover {

            text-decoration: underline;

            color: #7f0000;
        }


        /* ================= HOME ================= */

        .home-link {

            display: inline-block;

            margin-top: 18px;

            color: #777;

            text-decoration: none;

            font-size: 14px;

            transition: 0.3s;
        }


        .home-link:hover {

            color: #b71c1c;

            transform:
                    translateX(-3px);
        }


        /* ================= MOBILE ================= */

        @media (max-width: 600px) {

            body {

                padding: 20px 15px;
            }


            .login-container {

                padding:
                        35px 25px;

                border-radius: 20px;
            }


            h1 {

                font-size: 32px;
            }


            .blood-icon {

                font-size: 55px;
            }


            .subtitle {

                font-size: 15px;
            }


            input {

                font-size: 15px;

                padding: 13px 14px;
            }


            .password-box input {

                padding-right: 48px;
            }


            .login-btn {

                font-size: 16px;
            }

        }

    </style>
    ```

</head>

<body>

<!-- ===================================================== -->

<!-- ================= LOGIN CONTAINER =================== -->

<!-- ===================================================== -->

<div class="login-container">

    ```
    <!-- ================= BLOOD ICON ================= -->

    <div class="blood-icon">

        🩸

    </div>


    <!-- ================= HEADING ================= -->

    <h1>

        Welcome Back

    </h1>


    <p class="subtitle">

        Login to your Blood Bank account

    </p>


    <!-- ================================================= -->
    <!-- ================= LOGIN REQUIRED ================= -->
    <!-- ================================================= -->

    <div
            th:if="${param.loginRequired}"
            class="message login-required">

        🔒 Please login first to access this page.

    </div>


    <!-- ================================================= -->
    <!-- ================= WRONG LOGIN ==================== -->
    <!-- ================================================= -->

    <div
            th:if="${param.error}"
            class="message error-message">

        ❌ Invalid email or password!

    </div>


    <!-- ================================================= -->
    <!-- ============ PASSWORD RESET SUCCESS ============== -->
    <!-- ================================================= -->

    <div
            th:if="${param.resetSuccess}"
            class="message success-message">

        ✅ Password reset successfully!
        <br>
        You can now login with your new password.

    </div>


    <!-- ================================================= -->
    <!-- ================= LOGIN FORM ===================== -->
    <!-- ================================================= -->

    <form
            action="/login"
            method="post">


        <!-- ================= EMAIL ================= -->

        <div class="form-group">

            <label for="email">

                📧 Email

            </label>


            <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required>

        </div>


        <!-- ================= PASSWORD ================= -->

        <div class="form-group">

            <label for="password">

                🔑 Password

            </label>


            <div class="password-box">


                <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required>


                <!-- Show / Hide -->

                <button
                        type="button"
                        class="show-password"
                        id="showPassword"
                        onclick="togglePassword()"
                        aria-label="Show password">

                    👁️

                </button>


            </div>

        </div>


        <!-- ================= FORGOT PASSWORD ================= -->

        <div class="forgot-password">

            <a href="/forgot-password">

                🔑 Forgot Password?

            </a>

        </div>


        <!-- ================= LOGIN BUTTON ================= -->

        <button
                type="submit"
                class="login-btn"
                id="loginButton">

            🔐 Login

        </button>


    </form>


    <!-- ================================================= -->
    <!-- ================= REGISTER ======================= -->
    <!-- ================================================= -->

    <p class="register-text">

        Don't have an account?

        <a href="/register">

            Register

        </a>

    </p>


    <!-- ================================================= -->
    <!-- ================= HOME ============================ -->
    <!-- ================================================= -->

    <a
            href="/"
            class="home-link">

        ← Back to Home

    </a>
    ```

</div>

<!-- ===================================================== -->

<!-- ================= JAVASCRIPT ======================== -->

<!-- ===================================================== -->

<script>

    function togglePassword() {

        const passwordInput =
            document.getElementById("password");

        const showPasswordButton =
            document.getElementById("showPassword");


        if (passwordInput.type === "password") {

            passwordInput.type = "text";

            showPasswordButton.textContent = "🙈";

            showPasswordButton.setAttribute(
                "aria-label",
                "Hide password"
            );

        } else {

            passwordInput.type = "password";

            showPasswordButton.textContent = "👁️";

            showPasswordButton.setAttribute(
                "aria-label",
                "Show password"
            );
        }

    }


    /* ================= LOGIN BUTTON ================= */

    document
        .querySelector("form")
        .addEventListener("submit", function () {

            const button =
                document.getElementById("loginButton");

            button.textContent = "⏳ Logging in...";

            button.disabled = true;

        });

</script>

</body>

</html>
