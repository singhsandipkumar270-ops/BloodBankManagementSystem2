<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reset Password - Blood Bank</title>


    <style>

        /* ================= RESET ================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        /* ================= BODY ================= */

        body {

            min-height: 100vh;

            background:
                    linear-gradient(
                            135deg,
                            #8b0000,
                            #d32f2f,
                            #ff6f6f
                    );

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 30px;
        }


        /* ================= CONTAINER ================= */

        .reset-container {

            width: 100%;

            max-width: 500px;

            background:
                    rgba(255, 255, 255, 0.96);

            padding: 45px 50px;

            border-radius: 25px;

            box-shadow:
                    0 15px 40px
                    rgba(0, 0, 0, 0.25);

            text-align: center;

            animation:
                    containerAppear
                    0.6s
                    ease-in-out;
        }


        @keyframes containerAppear {

            from {

                opacity: 0;

                transform:
                        translateY(20px);
            }

            to {

                opacity: 1;

                transform:
                        translateY(0);
            }
        }


        /* ================= ICON ================= */

        .lock-icon {

            font-size: 65px;

            margin-bottom: 15px;
        }


        /* ================= HEADING ================= */

        h1 {

            color: #8b0000;

            font-size: 36px;

            margin-bottom: 10px;
        }


        .subtitle {

            color: #666;

            font-size: 16px;

            line-height: 1.5;

            margin-bottom: 25px;
        }


        /* ================= EMAIL ================= */

        .email-box {

            background: #fff3cd;

            color: #856404;

            border:
                    1px solid
                    #ffe69c;

            padding: 12px;

            border-radius: 10px;

            margin-bottom: 25px;

            font-size: 14px;

            font-weight: bold;

            word-break: break-word;
        }


        /* ================= FORM ================= */

        .form-group {

            text-align: left;

            margin-bottom: 20px;
        }


        label {

            display: block;

            color: #333;

            font-weight: bold;

            margin-bottom: 8px;

            font-size: 15px;
        }


        /* ================= PASSWORD BOX ================= */

        .password-box {

            position: relative;

            width: 100%;
        }


        input {

            width: 100%;

            padding: 14px 50px 14px 16px;

            border:
                    1px solid
                    #ddd;

            border-radius: 10px;

            font-size: 16px;

            outline: none;

            transition: 0.3s;
        }


        input:focus {

            border-color: #d32f2f;

            box-shadow:
                    0 0 0 3px
                    rgba(211, 47, 47, 0.12);
        }


        /* ================= SHOW PASSWORD ================= */

        .show-password {

            position: absolute;

            right: 12px;

            top: 50%;

            transform:
                    translateY(-50%);

            border: none;

            background: transparent;

            font-size: 20px;

            cursor: pointer;

            padding: 5px;

            color: #777;
        }


        .show-password:hover {

            color: #b71c1c;
        }


        /* ================= RESET BUTTON ================= */

        .reset-btn {

            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 30px;

            background:
                    linear-gradient(
                            90deg,
                            #b71c1c,
                            #e53935
                    );

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 5px;

            transition: 0.3s;
        }


        .reset-btn:hover {

            transform:
                    translateY(-3px);

            box-shadow:
                    0 8px 20px
                    rgba(183, 28, 28, 0.3);
        }


        /* ================= BACK LOGIN ================= */

        .back-login {

            display: inline-block;

            margin-top: 25px;

            color: #b71c1c;

            text-decoration: none;

            font-size: 15px;

            font-weight: bold;

            transition: 0.3s;
        }


        .back-login:hover {

            color: #7f0000;

            text-decoration: underline;
        }


        /* ================= MOBILE ================= */

        @media (max-width: 600px) {

            body {

                padding: 20px 15px;
            }


            .reset-container {

                padding:
                        35px 25px;

                border-radius: 20px;
            }


            h1 {

                font-size: 30px;
            }


            .lock-icon {

                font-size: 55px;
            }


            .subtitle {

                font-size: 15px;
            }


            input {

                font-size: 15px;

                padding:
                        13px 48px 13px 14px;
            }


            .reset-btn {

                font-size: 16px;
            }

        }

    </style>

</head>


<body>


<!-- ===================================================== -->
<!-- ================= MAIN CONTAINER ==================== -->
<!-- ===================================================== -->

<div class="reset-container">


    <!-- ================= ICON ================= -->

    <div class="lock-icon">

        🔐

    </div>


    <!-- ================= HEADING ================= -->

    <h1>

        Reset Password

    </h1>


    <p class="subtitle">

        Create a new password for your account.

    </p>


    <!-- ================= EMAIL ================= -->

    <div class="email-box">

        📧 Account Email:

        <span th:text="${email}">

            example@gmail.com

        </span>

    </div>


    <!-- ================= FORM ================= -->

    <form
            action="/reset-password"
            method="post">


        <!-- ================= HIDDEN EMAIL ================= -->

        <input
                type="hidden"
                name="email"
                th:value="${email}">


        <!-- ================= NEW PASSWORD ================= -->

        <div class="form-group">

            <label for="newPassword">

                🔑 New Password

            </label>


            <div class="password-box">

                <input
                        type="password"
                        id="newPassword"
                        name="newPassword"
                        placeholder="Enter new password"
                        autocomplete="new-password"
                        minlength="6"
                        required>


                <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword('newPassword', this)"
                        aria-label="Show password">

                    👁️

                </button>

            </div>

        </div>


        <!-- ================= CONFIRM PASSWORD ================= -->

        <div class="form-group">

            <label for="confirmPassword">

                🔐 Confirm Password

            </label>


            <div class="password-box">

                <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm new password"
                        autocomplete="new-password"
                        minlength="6"
                        required>


                <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword('confirmPassword', this)"
                        aria-label="Show password">

                    👁️

                </button>

            </div>

        </div>


        <!-- ================= RESET BUTTON ================= -->

        <button
                type="submit"
                class="reset-btn">

            🔐 Reset Password

        </button>


    </form>


    <!-- ================= BACK LOGIN ================= -->

    <a
            href="/login"
            class="back-login">

        ← Back to Login

    </a>


</div>


<!-- ===================================================== -->
<!-- ================= JAVASCRIPT ======================== -->
<!-- ===================================================== -->

<script>

    function togglePassword(
        inputId,
        button
    ) {

        const passwordInput =
            document.getElementById(inputId);


        if (passwordInput.type === "password") {

            passwordInput.type = "text";

            button.textContent = "🙈";

            button.setAttribute(
                "aria-label",
                "Hide password"
            );

        } else {

            passwordInput.type = "password";

            button.textContent = "👁️";

            button.setAttribute(
                "aria-label",
                "Show password"
            );
        }

    }


    /* ================= PASSWORD MATCH ================= */

    document
        .querySelector("form")
        .addEventListener("submit", function(event) {

            const newPassword =
                document.getElementById("newPassword").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;


            if (newPassword !== confirmPassword) {

                event.preventDefault();

                alert("New password and confirm password do not match.");

            }

        });

</script>


</body>

</html>
